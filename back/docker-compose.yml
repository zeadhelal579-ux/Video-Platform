# docker-compose.yml
# Purpose: Local DEVELOPMENT services only (PostgreSQL, RabbitMQ, MinIO) —
# TOOLS.md flags Docker as "recommended... gives a consistent local dev
# setup that starts with one command and mirrors production topology."
# You run the Api, Worker and frontend yourself with dotnet / npm.
# To run the WHOLE platform in containers instead, use the docker-compose.yml
# one folder up (see DEPLOYMENT.md).
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: videoplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"   # AMQP (MassTransit connects here)
      - "15672:15672" # Management UI: http://localhost:15672 (guest/guest)

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API — matches appsettings.json's Storage:ServiceUrl
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data

  # One-shot job: S3StorageService only ever *uses* the "videoplatform"
  # bucket — nothing in the C# code creates it or opens it to the browser.
  # This creates it and makes ONLY the HLS output (videos/<id>/hls/...) world-
  # readable, which is what the player needs; the raw uploads stay private.
  # CORS needs no setup: MinIO answers browser preflights for every origin by default.
  # Safe to re-run; it exits when done.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
          echo "waiting for minio..."
          sleep 2
        done
        mc mb --ignore-existing local/videoplatform
        cat > /tmp/policy.json <<'POLICY'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "AWS": ["*"] },
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::videoplatform/videos/*/hls/*"]
            }
          ]
        }
        POLICY
        mc anonymous set-json /tmp/policy.json local/videoplatform
        echo "MinIO bucket videoplatform is ready."

volumes:
  postgres-data:
  minio-data:
