# File: rabbitmq.conf
# Purpose: Extra RabbitMQ settings, mounted into /etc/rabbitmq/conf.d/.
# consumer_timeout: RabbitMQ closes the channel of a consumer that does not
# acknowledge a message within this time (default 30 minutes) and re-delivers
# the message — which for a long video would mean transcoding it twice at once.
# 4 hours is longer than the Worker's own 3-hour attempt timeout, so the
# Worker always gives up first. Value in milliseconds.
consumer_timeout = 14400000
