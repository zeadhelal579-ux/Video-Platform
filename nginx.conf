# File: nginx.conf
# Purpose: Serves the built SPA and reverse-proxies /api to the Api container,
# so the browser only ever talks to ONE origin (no CORS, first-party cookies).
# Lives in /etc/nginx/conf.d/, which nginx includes inside its http block —
# that is why a "map" can sit at the top level of this file.

# Keep the scheme the OUTERMOST proxy saw (e.g. Caddy terminating TLS); fall
# back to this server's own scheme when this nginx is the first hop.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # When a trusted proxy (Caddy, on a private Docker network) sits in front,
    # take the real visitor address from X-Forwarded-For. The Api rate-limits
    # per client address, so without this every visitor would share one bucket.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's embedded DNS. proxy_pass below uses a variable, which makes nginx
    # resolve "api" per request, so this container starts even before the Api is up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API calls are small JSON bodies; video bytes go straight to object storage.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # One value only (the real visitor): the Api trusts exactly one hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Vite writes content-hashed file names under /assets/, so they never change.
    # (add_header in a location replaces the server-level ones, hence the repeat.)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Everything else is the SPA: unknown paths fall back to index.html so
    # client-side routes (/watch/<id>, /dashboard) survive a page refresh.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }
}
